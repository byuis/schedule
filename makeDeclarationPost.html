<!DOCTYPE html>
<html lang="en">

<body>
<script>

  async function startMeUp(){
    const res = await fetch('https://declaration250.blogspot.com/feeds/posts/default?alt=json&max-results=0');
    const data = await res.json();
    const categories = data.feed.category || [];
    const highest = Math.max(...categories.map(c => Number(c.term)).filter(n => !isNaN(n)));
    console.log(highest);
  }



</script>
</body>
</html>
